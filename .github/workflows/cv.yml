name: Build CV
# Rebuilds cv.pdf whenever cv/CV.tex changes, and on demand
# from the Actions tab ("Run workflow").
on:
  push:
    paths:
      - 'cv/**.tex'
  workflow_dispatch:

permissions:
  contents: write   # commit cv.pdf back to the repository
  pages: write      # ask GitHub Pages to republish the site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV.tex
          working_directory: cv

      - name: Publish cv.pdf at the site root
        run: |
          cp cv/CV.pdf cv.pdf
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update cv.pdf"
            git push
          fi

      # Workflow-generated commits need an explicit Pages rebuild.
      # Working-branch CV builds should not republish the main site.
      - name: Republish the site
        if: github.ref == 'refs/heads/main'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
